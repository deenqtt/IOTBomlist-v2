name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.lower.outputs.owner_lc }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Lowercase owner
        id: lower
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Short SHA
        id: sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-sidecar:
    runs-on: ubuntu-latest
    needs: set-env
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./jlc-sidecar
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-sidecar:latest
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-sidecar:${{ needs.set-env.outputs.sha_short }}

  build-backend:
    runs-on: ubuntu-latest
    needs: set-env
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-backend:latest
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-backend:${{ needs.set-env.outputs.sha_short }}

  build-frontend:
    runs-on: ubuntu-latest
    needs: set-env
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-frontend:latest
            ${{ env.REGISTRY }}/${{ needs.set-env.outputs.owner_lc }}/iotbomlist-v2-frontend:${{ needs.set-env.outputs.sha_short }}
